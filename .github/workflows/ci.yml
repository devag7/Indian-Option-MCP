name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build (tsc + esbuild bundle)
        run: npm run build

      - name: Verify bundle exists
        run: |
          test -f dist/bundle.mjs || (echo "❌ dist/bundle.mjs not found" && exit 1)
          echo "✅ Bundle size: $(wc -c < dist/bundle.mjs) bytes"

      - name: Smoke test — MCP initialize handshake
        run: |
          RESPONSE=$(printf '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}\n' | timeout 10 node dist/bundle.mjs 2>/dev/null | head -1)
          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['result']['serverInfo']['name'] == 'indian-option-mcp', 'Wrong server name'
          tools = d['result']['capabilities'].get('tools', {})
          print(f'✅ Server: {d[\"result\"][\"serverInfo\"][\"name\"]} v{d[\"result\"][\"serverInfo\"][\"version\"]}')
          print(f'✅ Capabilities: {len(d[\"result\"][\"capabilities\"])} registered')
          "
